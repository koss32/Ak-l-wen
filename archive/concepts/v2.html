<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AK LÃ–WEN Ã— VALSET â€” Design-Konzept v2</title>
<style>
/* ============================================================
   AK LÃ–WEN â€” Konzept-Stylesheet
   Zwei Themes Ã¼ber [data-theme] auf <html>: "dark" (Standard) / "light"
   ============================================================ */

@font-face{
  font-family:"Cnd";
  src: local("DejaVu Sans Condensed Bold");
  font-weight: 700;
}

:root{
  /* ---- AK LÃ–WEN Â· DARK (Standard) ---- */
  --bg: #0F0F11;
  --bg-soft: #17171A;
  --surface: #1C1C1F;
  --surface-2: #232326;
  --ink: #F4F1EA;
  --ink-2: #B7B3AB;
  --ink-3: #7C7972;
  --line: #2B2B2E;
  --line-strong: #3A3A3D;
  --accent: #F0401F;
  --accent-2: #FF6547;
  --accent-ink: #100C09;
  --accent-soft: rgba(240,64,31,.14);
  --accent-soft-strong: rgba(240,64,31,.28);
  --shadow: 0 24px 60px rgba(0,0,0,.45);

  /* VALSET Circus Studio â€” Richtung B: blue and yellow */
  --b-bg: #071E38;
  --b-surface: #103F73;
  --b-ink: #EFF3F8;
  --b-accent: #F4CC46;
  --b-accent-ink: #10233B;

  --font-display: "DejaVu Sans Condensed","Liberation Sans Narrow","Arial Narrow",sans-serif;
  --font-body: "DejaVu Sans","Liberation Sans",Arial,sans-serif;

  --pad: clamp(20px,5vw,72px);
  --radius-s: 3px;
  --maxw: 1280px;

  color-scheme: dark;
}

html[data-theme="light"]{
  --bg: #EFEBE2;
  --bg-soft: #E7E2D5;
  --surface: #FFFFFF;
  --surface-2: #F8F5EE;
  --ink: #18150F;
  --ink-2: #55514A;
  --ink-3: #8B877D;
  --line: #DAD3C3;
  --line-strong: #C9C1AC;
  --accent: #F0401F;
  --accent-2: #D83416;
  --accent-ink: #100C09;
  --accent-soft: rgba(240,64,31,.10);
  --accent-soft-strong: rgba(240,64,31,.20);
  --shadow: 0 24px 50px rgba(30,25,15,.12);
  color-scheme: light;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .35s ease,color .35s ease;
}
img{display:block;max-width:100%}
a{color:inherit; text-decoration:none}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 var(--pad)}
section{position:relative}
.blk{padding:clamp(64px,9vh,120px) 0}
.blk-tight{padding:clamp(40px,6vh,72px) 0}

/* ---------- Typography ---------- */
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; letter-spacing:-.01em; color:var(--ink)}
h1{font-size:clamp(38px,6.2vw,84px); line-height:.98; letter-spacing:-.015em}
h2{font-size:clamp(28px,4vw,52px); line-height:1.03}
h3{font-size:22px; line-height:1.15}
h4{font-size:16px; letter-spacing:.02em}
p{color:var(--ink-2); max-width:58ch}
p.lead{color:var(--ink); font-size:clamp(17px,1.4vw,20px); line-height:1.5; max-width:52ch}
.eyebrow{
  display:inline-flex; align-items:center; gap:10px;
  font-family:var(--font-display); font-size:13px; letter-spacing:.08em;
  color:var(--accent); font-weight:700; margin-bottom:16px;
}
.eyebrow .num{
  font-family:var(--font-display); font-size:13px; border:1px solid var(--accent);
  width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;
}
.section-head{max-width:640px; margin-bottom:48px}
.section-head.wide{max-width:760px}

/* ---------- Utility ---------- */
.hidden{display:none !important}
.row{display:flex}
.center{text-align:center; margin-left:auto; margin-right:auto}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mt-32{margin-top:32px}.mt-48{margin-top:48px}

/* ---------- Placeholder chip ---------- */
.ph{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-body); font-size:12px; font-weight:600;
  color:var(--accent); background:var(--accent-soft);
  border:1px dashed var(--accent); border-radius:20px;
  padding:4px 10px 4px 8px; white-space:nowrap;
}
.ph::before{content:"â—Œ"; font-size:12px}
.ph-line{
  border:1px dashed var(--line-strong); border-radius:8px;
  color:var(--ink-3); background:transparent;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  background:var(--accent); color:var(--accent-ink);
  font-family:var(--font-display); font-size:14.5px; font-weight:700; letter-spacing:.02em;
  padding:15px 24px; border:0; cursor:pointer;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  transition:background .3s ease, transform .3s cubic-bezier(.2,.8,.2,1), color .3s ease;
}
.btn:hover{background:var(--accent-2); transform:translateY(-2px)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.btn.ghost{
  background:transparent; color:var(--ink); border:1.5px solid var(--line-strong);
  clip-path:none;
}
.btn.ghost:hover{border-color:var(--accent); color:var(--accent); background:transparent}
.btn.sm{padding:10px 16px; font-size:12.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45; cursor:not-allowed; pointer-events:none}
.tlink{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-display); font-size:14px; color:var(--ink);
  border-bottom:1.5px solid var(--accent); padding-bottom:2px; font-weight:700;
}
.micro{font-size:12.5px; color:var(--ink-3)}

/* ---------- Header ---------- */
header{
  position:fixed; inset:0 0 auto 0; z-index:80;
  border-bottom:1px solid transparent;
  background:transparent;
  transition:background .4s ease,border-color .4s ease;
}
header.solid{background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px); border-color:var(--line)}
.topbar{
  background:var(--surface); border-bottom:1px solid var(--line);
  font-size:12px; color:var(--ink-3); text-align:center; padding:7px var(--pad);
}
.topbar b{color:var(--accent)}
.nav{display:flex; align-items:center; justify-content:space-between; gap:20px; height:76px}
.brand{display:flex; align-items:center; gap:12px; font-family:var(--font-display); font-weight:700}
.brand img{height:38px; width:auto}
.logo-light{display:none}
html[data-theme="light"] .logo-dark{display:none}
html[data-theme="light"] .logo-light{display:block}
.brand .word{font-size:19px; letter-spacing:.03em}
.nav-links{display:flex; align-items:center; gap:30px; list-style:none}
.nav-links a{
  font-family:var(--font-display); font-size:14px; font-weight:700; color:var(--ink-2);
  position:relative; padding:4px 0; transition:color .25s ease;
}
.nav-links a:hover, .nav-links a.active{color:var(--ink)}
.nav-links a.active::after{
  content:""; position:absolute; left:0; right:0; bottom:-3px; height:2px; background:var(--accent);
}
.nav-right{display:flex; align-items:center; gap:16px}

/* theme toggle */
.tgl{
  display:inline-flex; align-items:center; cursor:pointer;
  background:var(--bg-soft); border:1px solid var(--line); border-radius:20px;
  padding:4px; position:relative; width:52px; height:30px; flex-shrink:0;
}
.tgl .dot{
  width:22px; height:22px; border-radius:50%; background:var(--accent);
  display:flex; align-items:center; justify-content:center; color:var(--accent-ink); font-size:12px;
  transform:translateX(0); transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
html[data-theme="light"] .tgl .dot{transform:translateX(22px)}
.tgl .ic-sun{display:none}
html[data-theme="light"] .tgl .ic-moon{display:none}
html[data-theme="light"] .tgl .ic-sun{display:block}

.burger{display:none; flex-direction:column; gap:5px; background:none; border:0; cursor:pointer; padding:6px}
.burger span{width:24px; height:2px; background:var(--ink); display:block}

@media(max-width:980px){
  .nav-links{display:none}
  .burger{display:flex}
}

/* mobile full menu */
.mmenu{
  position:fixed; inset:0; z-index:95; background:var(--bg);
  display:flex; flex-direction:column; padding:24px var(--pad) 40px;
  transform:translateY(-100%); transition:transform .4s cubic-bezier(.2,.8,.2,1);
}
.mmenu.open{transform:translateY(0)}
.mmenu-top{display:flex; align-items:center; justify-content:space-between; height:56px}
.mmenu-close{background:none;border:0;color:var(--ink);font-size:28px;line-height:1;cursor:pointer}
.mmenu ul{list-style:none; margin-top:24px; display:flex; flex-direction:column; gap:4px}
.mmenu a{font-family:var(--font-display); font-size:32px; font-weight:700; color:var(--ink); padding:14px 0; border-bottom:1px solid var(--line)}
.mmenu-foot{margin-top:auto; display:flex; flex-direction:column; gap:18px}

/* ---------- Hero ---------- */
.hero{min-height:100svh; display:flex; flex-direction:column; justify-content:center; padding-top:120px; padding-bottom:56px;
  background:
    radial-gradient(1100px 700px at 82% -10%, var(--accent-soft), transparent 60%),
    var(--bg);
  position:relative; overflow:hidden;
}
.hero-oct{
  position:absolute; right:-180px; top:50%; transform:translateY(-50%);
  width:900px; height:900px; opacity:.5; pointer-events:none;
}
.hero-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:56px; align-items:end; position:relative; z-index:2}
.hero h1{max-width:14ch}
.hero h1 em{font-style:normal; color:var(--accent)}
.hero-sub{margin-top:22px}
.hero-cta{display:flex; gap:14px; margin-top:34px; flex-wrap:wrap}
.hero-note{margin-top:18px}

.entry-cards{display:flex; flex-direction:column; gap:16px}
.entry-card{
  background:var(--surface); border:1px solid var(--line);
  padding:26px 26px 24px;
  clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
  transition:border-color .3s ease, transform .3s ease;
}
.entry-card:hover{transform:translateY(-3px)}
.entry-card .tag{font-family:var(--font-display); font-size:11px; letter-spacing:.1em; font-weight:700}
.entry-card.a{border-color:var(--accent-soft-strong)}
.entry-card.a .tag{color:var(--accent)}
.entry-card.a:hover{border-color:var(--accent)}
.entry-card.b{
  background:var(--b-bg); border:1px dashed rgba(244,204,70,.5); color:var(--b-ink);
}
.entry-card.b .tag{color:var(--b-accent)}
.entry-card.b h3{color:var(--b-ink); font-family:var(--font-display)}
.entry-card.b p{color:#B9C4D2}
.entry-card h3{margin-top:8px; font-size:24px}
.entry-card p{margin-top:8px; font-size:14.5px}
.entry-card .row-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:18px}
.badge-soon{
  font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--b-accent-ink);
  background:var(--b-accent); padding:5px 10px; border-radius:3px;
}

/* ---------- Cards grid generic ---------- */
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:20px}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
.grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:20px}
@media(max-width:1080px){.grid-4{grid-template-columns:repeat(2,1fr)} .grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}

/* ---------- Discipline cards ---------- */
.disc-card{
  background:var(--surface); border:1px solid var(--line);
  padding:26px 22px; display:flex; flex-direction:column; gap:14px; min-height:270px;
  clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
  transition:border-color .25s ease, background .25s ease;
}
.disc-card.placeholder{border-style:dashed; border-color:var(--line-strong); background:transparent}
.disc-card .icon{width:40px;height:40px; color:var(--accent)}
.disc-card.placeholder .icon{color:var(--ink-3)}
.disc-card h3{font-size:21px}
.disc-card.placeholder h3{color:var(--ink-3); font-family:var(--font-body); font-weight:700; font-size:16px}
.disc-card p{font-size:14px; flex-grow:1}
.disc-card .row-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:auto}
.disc-toggle{
  background:none; border:0; font-family:var(--font-display); font-size:13px; font-weight:700;
  color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:6px;
}
.disc-toggle svg{width:12px;height:12px; transition:transform .25s ease}
.disc-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.disc-toggle:hover{color:var(--accent)}

.disc-detail{
  grid-column:1/-1; overflow:hidden; max-height:0; transition:max-height .4s ease;
}
.disc-detail.open{max-height:600px}
.disc-detail-inner{
  background:var(--surface-2); border:1px solid var(--line); padding:32px; margin-top:4px;
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:28px;
}
@media(max-width:780px){.disc-detail-inner{grid-template-columns:1fr}}
.dd-label{font-family:var(--font-display); font-size:12px; letter-spacing:.06em; color:var(--ink-3); margin-bottom:10px}
.dd-chip{
  display:inline-flex; margin:0 6px 6px 0; padding:6px 10px; font-size:13px;
  border:1px dashed var(--line-strong); border-radius:6px; color:var(--ink-2);
}

/* ---------- Trainer ---------- */
.trainer-card{
  background:var(--surface); border:1px solid var(--line); padding:22px; text-align:left;
}
.trainer-avatar{
  width:100%; aspect-ratio:1/1; background:var(--surface-2); border:1px dashed var(--line-strong);
  display:flex; align-items:center; justify-content:center; margin-bottom:16px; position:relative;
}
.trainer-avatar svg{width:46%; height:46%; color:var(--ink-3)}
.trainer-name{font-family:var(--font-display); font-weight:700; font-size:17px}
.trainer-role{font-size:13px; color:var(--ink-3); margin-top:2px}
.trainer-note{font-size:12.5px; color:var(--accent); margin-top:10px}

/* ---------- Stundenplan ---------- */
.sp-card{background:var(--surface); border:1px solid var(--line); padding:24px}
.sp-card h4{font-family:var(--font-display); font-size:15px; letter-spacing:.02em; display:flex; align-items:center; gap:10px}
.sp-card h4 .dotc{width:8px;height:8px;border-radius:50%;background:var(--accent); display:inline-block}
.sp-rows{margin-top:16px; display:flex; flex-direction:column; gap:8px}
.sp-row{display:flex; align-items:center; justify-content:space-between; font-size:13.5px; padding:8px 10px; border:1px dashed var(--line-strong); border-radius:6px; color:var(--ink-2)}
.notice-banner{
  display:flex; gap:12px; align-items:flex-start; background:var(--surface-2);
  border-left:3px solid var(--accent); padding:16px 20px; margin-bottom:36px; font-size:13.5px; color:var(--ink-2);
}

/* ---------- Preise ---------- */
.price-card{
  background:var(--surface); border:1px solid var(--line); padding:30px 26px; display:flex; flex-direction:column; gap:6px;
  clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
}
.price-card.b-variant{border-color:rgba(241,185,59,.35)}
.price-card .amount{font-family:var(--font-display); font-size:44px; font-weight:700; color:var(--ink); display:flex; align-items:baseline; gap:6px}
.price-card .amount small{font-size:14px; color:var(--ink-3); font-family:var(--font-body); font-weight:400}
.price-card h4{font-size:15px}
.price-card p{font-size:13px}

/* ---------- Kontakt ---------- */
.kontakt-col{background:var(--surface); border:1px solid var(--line); padding:32px}
.kontakt-col.b{border-color:rgba(241,185,59,.35)}
.kontakt-row{display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--line)}
.kontakt-row:last-child{border-bottom:0}
.kontakt-row svg{width:18px;height:18px; color:var(--accent); flex-shrink:0; margin-top:2px}
.kontakt-col.b .kontakt-row svg{color:var(--b-accent)}
.legal-strip{
  margin-top:28px; border-top:1px solid var(--line); padding-top:24px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
  font-size:13px; color:var(--ink-3);
}

/* ---------- Probetraining form ---------- */
.form-wrap{background:var(--surface); border:1px solid var(--line); padding:40px; max-width:640px}
.field{margin-bottom:20px}
.field label{display:block; font-size:12.5px; font-weight:700; letter-spacing:.03em; color:var(--ink-2); margin-bottom:8px; font-family:var(--font-display)}
.field input, .field select, .field textarea{
  width:100%; background:var(--bg-soft); border:1px solid var(--line-strong); color:var(--ink);
  padding:13px 14px; font-family:var(--font-body); font-size:14.5px; border-radius:2px;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:18px}
@media(max-width:560px){.field-row{grid-template-columns:1fr}}
.checkbox-row{display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:var(--ink-3); margin-bottom:24px}
.checkbox-row input{margin-top:3px}
.demo-note{font-size:11.5px; color:var(--ink-3); margin-top:14px; text-align:center}

/* ---------- About / AK LÃ¶wen section ---------- */
.about-grid{display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center}
@media(max-width:900px){.about-grid{grid-template-columns:1fr}}
.value-list{list-style:none; display:flex; flex-direction:column; gap:18px; margin-top:24px}
.value-list li{display:flex; gap:14px; align-items:flex-start; font-size:14.5px; color:var(--ink-2)}
.value-list .n{font-family:var(--font-display); color:var(--accent); font-weight:700; font-size:15px}
.about-mark{
  aspect-ratio:1/1; background:var(--bg-soft); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; padding:40px;
}
.about-mark img{max-width:70%}

/* ---------- Footer ---------- */
footer{background:var(--bg-soft); border-top:1px solid var(--line); padding:60px 0 26px}
.foot-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:40px}
@media(max-width:820px){.foot-grid{grid-template-columns:1fr 1fr} }
@media(max-width:520px){.foot-grid{grid-template-columns:1fr}}
.foot-brand{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.foot-brand img{height:34px}
.foot-brand span{font-family:var(--font-display); font-weight:700; font-size:18px}
footer h5{font-family:var(--font-display); font-size:13px; letter-spacing:.04em; color:var(--ink-3); margin-bottom:14px}
footer ul{list-style:none; display:flex; flex-direction:column; gap:10px}
footer a{font-size:13.5px; color:var(--ink-2)}
footer a:hover{color:var(--accent)}
.foot-bottom{
  margin-top:48px; padding-top:22px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  font-size:12px; color:var(--ink-3);
}

/* ---------- Concept ribbon (marks this as a non-production concept) ---------- */
.concept-tag{
  position:fixed; z-index:60; bottom:18px; left:18px;
  background:var(--surface); border:1px solid var(--line-strong); color:var(--ink-2);
  font-size:11px; padding:8px 12px; border-radius:20px; display:flex; align-items:center; gap:8px;
  box-shadow:var(--shadow);
}
.concept-tag .d{width:7px;height:7px;border-radius:50%;background:var(--accent)}

@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr; gap:40px}
  .hero-oct{opacity:.25; right:-260px}
  .about-grid{gap:32px}
  .disc-detail-inner{padding:22px}
}


/* ---------- Version 2: AK LÃ–WEN Ã— VALSET ---------- */
section[id], #valset-kontakt{scroll-margin-top:108px}
header{background:color-mix(in srgb, var(--bg) 96%, transparent);border-color:var(--line)}
.topbar{margin-top:76px;position:relative;font-size:11px;padding:7px var(--pad)}
.hero{min-height:calc(100svh - 114px);padding-top:70px}
.brand-family{display:flex;align-items:center;gap:20px;flex-shrink:0}
.valset-wordmark{padding-left:20px;border-left:1px solid var(--line-strong);display:flex;flex-direction:column;line-height:1.1;color:var(--b-accent)}
.valset-wordmark strong{font-family:Georgia,serif;font-weight:400;letter-spacing:.04em;font-size:24px}
.valset-wordmark small{font-size:8px;letter-spacing:.19em;margin-top:5px;color:var(--ink-2)}
html[data-theme="light"] .valset-wordmark{color:var(--b-surface)}
.nav-links{gap:18px}
.nav-links .valset-nav{color:var(--b-accent)}
html[data-theme="light"] .nav-links .valset-nav{color:var(--b-surface)}
.nav-links .valset-nav.active::after{background:var(--b-accent)}
.mmenu .valset-nav{color:var(--b-accent)}
html[data-theme="light"] .mmenu .valset-nav{color:var(--b-surface)}
.mmenu{overflow-y:auto;visibility:hidden}
.mmenu.open{visibility:visible}
.mmenu ul{margin-top:14px}
.mmenu li a{display:block;padding:10px 0;font-size:27px}
.mmenu-foot{padding-top:24px}
.entry-card.b{border:1px solid rgba(244,204,70,.4);background:linear-gradient(120deg,var(--b-bg),var(--b-surface));}
.entry-card.b:hover{border-color:var(--b-accent)}
.entry-card.b h3{font:400 36px/1.1 Georgia,serif;letter-spacing:.04em;margin-top:12px;color:var(--b-accent)}
.entry-card.b .row-bottom{border-top:1px solid rgba(244,204,70,.2);padding-top:16px;margin-top:18px;gap:12px}
.entry-card.b .tlink,.valset-section .tlink,.foot-valset .tlink{border-color:var(--b-accent);color:var(--b-ink)}
.valset-entry-top{display:grid;grid-template-columns:1fr 116px;gap:12px;align-items:center}
.valset-entry-mark{aspect-ratio:1;border:1px solid rgba(244,204,70,.25);overflow:hidden}
.valset-entry-mark img{width:100%;height:100%;object-fit:cover}
.valset-small{font-size:11px;font-weight:400;letter-spacing:.03em;color:#BED0E0;white-space:nowrap}
.kontakt-col.b{background:linear-gradient(120deg,var(--b-bg),var(--b-surface));border:1px solid rgba(244,204,70,.35)}
.kontakt-col.b .ph{color:var(--b-accent);border-color:rgba(244,204,70,.5)}
.kontakt-col.b .kontakt-row{border-color:rgba(244,204,70,.2)}
.price-card.b-variant{background:var(--b-bg);border-color:rgba(244,204,70,.35)}
.price-card.b-variant .amount{color:var(--b-accent)}
.price-card.b-variant h4,.price-card.b-variant p,.price-card.b-variant .amount small{color:var(--b-ink)}
.price-card.b-variant .ph{color:var(--b-accent);border-color:var(--b-accent);background:rgba(244,204,70,.08)}
.valset-section{background:linear-gradient(115deg,#061A30 0%,#0A2D54 65%,#103F73 100%);color:var(--b-ink);overflow:hidden;border-top:3px solid var(--b-accent)}
.valset-section-top{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid rgba(244,204,70,.22);padding-bottom:20px;margin-bottom:44px;color:#BED0E0;font-size:11px;letter-spacing:.14em}
.valset-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center}
.valset-copy .eyebrow{color:var(--b-accent);font-size:12px}
.valset-copy h2{color:var(--b-ink);font-size:clamp(34px,4.1vw,58px);line-height:1.04}
.valset-copy h2 em{color:var(--b-accent);font-style:normal}
.valset-copy p{color:#BED0E0;font-size:14px;max-width:48ch}
.valset-copy p.lead{font-size:18px;color:var(--b-ink)}
.valset-actions{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-top:30px}
.btn.valset-btn{background:var(--b-accent);color:var(--b-accent-ink)}
.btn.valset-btn:hover{background:#FFE17A}
.btn.valset-btn:focus-visible{outline-color:var(--b-accent)}
.valset-copy .valset-pending{font-size:11.5px;margin-top:20px;color:#A6BDD2}
.valset-visual{margin:0;border:1px solid rgba(244,204,70,.3);background:#081C2B;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.valset-art{aspect-ratio:1;overflow:hidden}
.valset-art img{width:100%;height:100%;object-fit:cover;object-position:center}
.valset-visual figcaption{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-top:1px solid rgba(244,204,70,.2);color:var(--b-accent);font-size:10px;letter-spacing:.12em}
.valset-visual figcaption span:first-child{font:400 22px Georgia,serif;letter-spacing:.03em}

/* ---------- Concept modules: mobile scenarios + design system ---------- */
.concept-section{background:var(--bg-soft);border-top:1px solid var(--line)}
.concept-kicker{color:var(--accent);font:700 11px var(--font-display);letter-spacing:.14em;text-transform:uppercase}
.mobile-preview-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.phone-preview{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:9px;box-shadow:var(--shadow);min-width:0}
.phone-preview .phone-screen{min-height:250px;border:1px solid var(--line-strong);border-radius:12px;padding:13px 11px;display:flex;flex-direction:column;gap:12px;background:var(--bg);overflow:hidden}
.phone-preview .phone-bar{height:4px;width:42px;border-radius:4px;background:var(--accent);margin:0 auto 4px}
.phone-preview .phone-nav{display:flex;justify-content:space-between;align-items:center;font:700 9px var(--font-display)}
.phone-preview .phone-nav span:last-child{color:var(--accent)}
.phone-preview h4{font-size:15px;line-height:1.05;margin-top:8px}
.phone-preview p{font-size:11px;line-height:1.35;color:var(--ink-2)}
.phone-preview .phone-line{height:8px;background:var(--bg-soft);border:1px solid var(--line);border-radius:4px}
.phone-preview .phone-line.short{width:64%}
.phone-preview .phone-cta{margin-top:auto;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:8px 6px;text-align:center;font:700 9px var(--font-display)}
.phone-preview .phone-chip{display:inline-block;border:1px solid var(--line-strong);padding:5px 6px;border-radius:4px;font:700 9px var(--font-display);color:var(--ink-2)}
.phone-label{display:block;margin-top:11px;font:700 11px var(--font-display);letter-spacing:.04em}
.token-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.token-card{background:var(--surface);border:1px solid var(--line);padding:18px;min-height:132px}
.token-card h4{margin-bottom:13px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:27px;height:27px;border-radius:50%;border:1px solid var(--line-strong)}
.token-meta{font-size:12px;color:var(--ink-2);line-height:1.5}
.type-sample-xl{font:700 28px/1 var(--font-display);letter-spacing:-.04em}.type-sample-body{font-size:14px;line-height:1.5;color:var(--ink-2)}
.component-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.component-pill{border:1px solid var(--line-strong);padding:8px 10px;font:700 11px var(--font-display)}
.component-pill.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media(max-width:1100px){.mobile-preview-grid{grid-template-columns:repeat(3,1fr)}.token-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.mobile-preview-grid,.token-grid{grid-template-columns:1fr 1fr}.phone-preview .phone-screen{min-height:220px}.token-card{padding:14px}}
@media(max-width:420px){.mobile-preview-grid,.token-grid{grid-template-columns:1fr}}
.foot-grid{grid-template-columns:1.25fr 1.25fr .8fr .8fr .8fr;gap:30px}
.foot-valset{padding:18px;margin:-18px 0 0;background:var(--b-bg);border-top:2px solid var(--b-accent)}
.foot-valset .foot-brand{color:var(--b-accent);gap:10px}
.foot-valset .foot-brand>span:last-child{font:400 23px/1.15 Georgia,serif}
.foot-valset .foot-brand small{display:block;font:8px/1.4 var(--font-body);letter-spacing:.14em;margin-top:4px;color:#BED0E0}
.foot-valset p{font-size:12.5px;color:#BED0E0}
.foot-valset-mark{display:block;width:40px;height:48px;overflow:hidden;flex-shrink:0}
.foot-valset-mark img{width:100%;height:100%;object-fit:cover}
.foot-valset a:hover{color:var(--b-accent)}
.concept-tag{font-size:10px;padding:6px 10px;bottom:12px;left:12px}
@media(max-width:1180px){.nav-links{display:none}.burger{display:flex}.foot-grid{grid-template-columns:1.2fr 1.2fr 1fr;row-gap:36px}}
@media(max-width:900px){.valset-grid{grid-template-columns:1fr;gap:36px}.valset-visual{max-width:520px;width:100%}.hero{padding-top:48px}.entry-cards{display:grid;grid-template-columns:1fr 1fr}.valset-entry-top{grid-template-columns:1fr}.valset-entry-mark{display:none}.hero-grid{gap:32px}}
@media(max-width:640px){.brand-family{gap:12px}.brand{gap:7px}.brand img{height:30px}.brand .word{font-size:16px}.valset-wordmark{padding-left:12px}.valset-wordmark strong{font-size:21px}.valset-wordmark small{font-size:6.5px}.nav{height:70px;gap:10px}.nav-right{gap:10px}.topbar{margin-top:70px;font-size:10px}.topbar .ph{font-size:9px!important}.entry-cards{grid-template-columns:1fr}.valset-entry-top{grid-template-columns:1fr 108px}.valset-entry-mark{display:block}.hero{padding-top:42px;padding-bottom:48px}.valset-section-top{font-size:9px;margin-bottom:32px}.valset-section .blk{padding:60px 0}.foot-grid{grid-template-columns:1fr 1fr;gap:32px 22px}.foot-valset{margin:0;padding:16px}.foot-grid>div:first-child{grid-column:1/-1}.foot-valset{grid-column:1/-1}.form-wrap{padding:24px}.foot-bottom{padding-bottom:26px}}
@media(max-width:380px){.brand-family{gap:8px}.valset-wordmark{padding-left:8px}.nav-right{gap:6px}.brand .word{font-size:14px}.brand img{height:27px}.valset-wordmark strong{font-size:18px}.tgl{width:46px}.tgl .dot{width:18px;height:18px}html[data-theme="light"] .tgl .dot{transform:translateX(18px)}.entry-card{padding:22px}.entry-card.b .valset-small{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}

</style>
